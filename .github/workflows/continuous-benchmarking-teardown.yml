name: Teardown VM and remove self-hosted runner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 3"

permissions:
  actions: write
  contents: read

jobs:
  teardown-aws-vm:
    runs-on: ubuntu-latest
    env:
      AWS_RUNNER_NAME: stellar-continuous-aws
    steps:
      -   uses: actions/checkout@v4

      -   name: Configure AWS credentials using EASE lab account
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
            aws-region: us-west-1

      -   name: Remove self-hosted runners
          env:
            GH_TOKEN: ${{ secrets.DEPLOY_SELF_HOSTED_RUNNER_TOKEN }}
          run: |
            set -euo pipefail
            RUNNER_NAME="${{ env.AWS_RUNNER_NAME }}"
            IDS=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" --paginate \
                  --jq '.runners[] | select(.name=="'"${RUNNER_NAME}"'") | .id')
            if [ -z "${IDS}" ]; then
              echo "No runners named ${RUNNER_NAME} found; nothing to delete."
            else
              for ID in ${IDS}; do
                echo "Deleting runner id=${ID} name=${RUNNER_NAME}"
                gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runners/${ID}"
              done
            fi

      -   name: Get AWS EC2 instance ID
          run: |
            echo id=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=${{ env.AWS_RUNNER_NAME }}" --query "Reservations[*].Instances[*].InstanceId" --output text) > $GITHUB_OUTPUT
          id: get-instance-id

      -   name: Terminate AWS EC2 instance
          run: |
            aws ec2 terminate-instances --instance-ids ${{ steps.get-instance-id.outputs.id }}

  teardown-cloudflare-vm:
      runs-on: ubuntu-latest
      env:
        CLOUDFLARE_RUNNER_NAME: stellar-continuous-cloudflare
      steps:
        -   uses: actions/checkout@v4

        -   name: Configure AWS credentials using EASE lab account
            uses: aws-actions/configure-aws-credentials@v4
            with:
              aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
              aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
              aws-region: us-east-2

        -   name: Remove self-hosted runners
            env:
              GH_TOKEN: ${{ secrets.DEPLOY_SELF_HOSTED_RUNNER_TOKEN }}
            run: |
              set -euo pipefail
              RUNNER_NAME="${{ env.CLOUDFLARE_RUNNER_NAME }}"
              IDS=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" --paginate \
                    --jq '.runners[] | select(.name=="'"${RUNNER_NAME}"'") | .id')
              if [ -z "${IDS}" ]; then
                echo "No runners named ${RUNNER_NAME} found; nothing to delete."
              else
                for ID in ${IDS}; do
                  echo "Deleting runner id=${ID} name=${RUNNER_NAME}"
                  gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runners/${ID}"
                done
              fi

        -   name: Get AWS EC2 instance ID
            run: |
              echo id=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=${{ env.CLOUDFLARE_RUNNER_NAME }}" --query "Reservations[*].Instances[*].InstanceId" --output text) > $GITHUB_OUTPUT
            id: get-instance-id

        -   name: Terminate AWS EC2 instance
            run: |
              aws ec2 terminate-instances --instance-ids ${{ steps.get-instance-id.outputs.id }}

  teardown-azure-vm:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4

      - name: Setup Azure CLI
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Remove self-hosted runners
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_SELF_HOSTED_RUNNER_TOKEN }}
        run: |
          set -euo pipefail
          RUNNER_NAME="stellar-continuous-azure"
          IDS=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" --paginate \
                --jq '.runners[] | select(.name=="'"${RUNNER_NAME}"'") | .id')
          if [ -z "${IDS}" ]; then
            echo "No runners named ${RUNNER_NAME} found; nothing to delete."
          else
            for ID in ${IDS}; do
              echo "Deleting runner id=${ID} name=${RUNNER_NAME}"
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runners/${ID}"
            done
          fi

      - name: Delete Azure resource group
        run: az group delete --resource-group github-actions-runners --yes

  teardown-gcr-vm:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Configure GCR credentials
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCR_CREDENTIALS }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          version: ">= 363.0.0"

      - name: Remove self-hosted runners
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_SELF_HOSTED_RUNNER_TOKEN }}
        run: |
          set -euo pipefail
          RUNNER_NAME="stellar-continuous-gcr"
          IDS=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" --paginate \
                --jq '.runners[] | select(.name=="'"${RUNNER_NAME}"'") | .id')
          if [ -z "${IDS}" ]; then
            echo "No runners named ${RUNNER_NAME} found; nothing to delete."
          else
            for ID in ${IDS}; do
              echo "Deleting runner id=${ID} name=${RUNNER_NAME}"
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runners/${ID}"
            done
          fi

      - name: Delete GCloud Compute Engine VM (idempotent)
        run: |
          set -euo pipefail
          INSTANCE="github-actions-runner-gcr"
          ZONE="us-west1-a"
          PROJECT="stellar-benchmarking"

          if gcloud compute instances describe "$INSTANCE" --zone="$ZONE" --project="$PROJECT" >/dev/null 2>&1; then
            echo "Deleting $INSTANCE in $ZONE..."
            gcloud compute instances delete "$INSTANCE" --zone="$ZONE" --project="$PROJECT" --quiet
            echo "Deleted $INSTANCE."
          else
            echo "Instance $INSTANCE not found in $ZONE ($PROJECT); skipping."
          fi
